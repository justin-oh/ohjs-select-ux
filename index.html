<!doctype html>
<html>
  <head>
    <title>Select UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <form>
        <div class="mb-3">
          <label for="select_single" class="form-label">Select Single</label>
          <select name="select_single" id="select_single" class="form-select" required>
            <option value="one">One</option>
            <option value="two">Two</option>
            <option value="three" selected>Three</option>
            <optgroup label="Four">
              <option value="four_a">Four A</option>
              <option value="four_b">Four B</option>
            </optgroup>
            <option value="five">Five</option>
            <option value="volvo">Six</option>
            <option value="seven">Seven</option>
            <optgroup label="Eight">
              <option value="eight_a">Eight A</option>
              <option value="eight_b">Eight B</option>
              <option value="eight_c">Eight C</option>
              <option value="eight_d">Eight D</option>
              <option value="eight_e">Eight E</option>
              <option value="eight_f">Eight F</option>
              <option value="eight_g">Eight G</option>
              <option value="eight_h">Eight H</option>
              <option value="eight_i">Eight I</option>
              <option value="eight_j">Eight J</option>
              <option value="eight_k">Eight K</option>
              <option value="eight_l">Eight L</option>
            </optgroup>
          </select>
        </div>
        <div class="mb-3">
          <label for="select_multiple" class="form-label">Select Multiple</label>
          <select name="select_multiple[]" id="select_multiple" class="form-select" required multiple>
            <option value="one">One</option>
            <option value="two">Two</option>
            <option value="three" selected>Three</option>
            <optgroup label="Four">
              <option value="four_a">Four A</option>
              <option value="four_b">Four B</option>
            </optgroup>
            <option value="five">Five</option>
            <option value="volvo">Six</option>
            <option value="seven">Seven</option>
            <optgroup label="Eight">
              <option value="eight_a">Eight A</option>
              <option value="eight_b">Eight B</option>
              <option value="eight_c">Eight C</option>
              <option value="eight_d">Eight D</option>
              <option value="eight_e">Eight E</option>
              <option value="eight_f">Eight F</option>
              <option value="eight_g">Eight G</option>
              <option value="eight_h">Eight H</option>
              <option value="eight_i">Eight I</option>
              <option value="eight_j">Eight J</option>
              <option value="eight_k">Eight K</option>
              <option value="eight_l">Eight L</option>
            </optgroup>
          </select>
        </div>
        <div class="mb-3">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>

      <input type="text" id="value" placeholder="Value">
      <input type="text" id="label" placeholder="Label">
      <input type="text" id="group" placeholder="Group">
      <button id="add_option">Add option</button>
      <button id="remove_option">Remove option</button>
      <button id="clear_options">Clear options</button>
      <button id="set_value">Set value</button>
    </div>

    <style>
      .select-ux {
        .select-ux__select__values {
          display: flex;
          flex-wrap: wrap;
          gap: 0.25rem;
          align-items: center;

          .select-ux__value {
            /* @extend .btn;
            @extend .btn-secondary; */
            --bs-btn-padding-y: 0;
            --bs-btn-padding-x: 0.25rem;
            --bs-btn-font-size: 0.875rem;
            --bs-btn-border-radius: calc(var(--bs-border-radius-sm)/2);
            /* matches the line height of normal text */
            height: 1.5rem;
          }
        }

        .select-ux__scroll-box {
          max-height: 10rem;
          padding-left: 0.25rem;

          .select-ux__dropdown {
            /* @extend .form-control; */
          }

          .select-ux__search {
            /* @extend .form-control; */
          }
        }

        .select-ux__option {
          /* @extend .form-check; */

          .select-ux__option__input {
            /* @extend .form-check-input; */
          }

          .select-ux__option__label {
            /* @extend .form-check-label; */
          }
        }

        .select-ux__group {
          .select-ux__group__heading {
            font-weight: bold;
          }

          .select-ux__option {
            margin-left: 1rem;
          }
        }
      }
    </style>

    <script src="index.js"></script>
    <script>
      const options = {
        dropdownClassName: 'select-ux__dropdown form-control',
        searchClassName: 'select-ux__search form-control mb-2',
        selectValueClassName: 'select-ux__value btn btn-secondary',
        optionClassName: 'select-ux__option form-check',
        optionInputClassName: 'select-ux__option__input form-check-input',
        optionLabelClassName: 'select-ux__option__label form-check-label',
      };

      options.htmlSelectElement = document.getElementById('select_single');

      const selectUXSingle = new SelectUX(options);

      options.htmlSelectElement = document.getElementById('select_multiple');

      const selectUXMultiple = new SelectUX(options);

      const value = document.getElementById('value');
      const label = document.getElementById('label');
      const group = document.getElementById('group');

      const addOption = document.getElementById('add_option');

      addOption.addEventListener('click', function(e) {
        e.preventDefault();

        selectUXMultiple.addOption(value.value, label.value, group.value);
      });

      const removeOption = document.getElementById('remove_option');

      removeOption.addEventListener('click', function(e) {
        e.preventDefault();

        selectUXMultiple.removeOption(value.value);
      });

      const clearOptions = document.getElementById('clear_options');

      clearOptions.addEventListener('click', function(e) {
        e.preventDefault();

        selectUXMultiple.clearOptions();
      });

      const setValue = document.getElementById('set_value');

      setValue.addEventListener('click', function(e) {
        e.preventDefault();

        selectUXMultiple.setValue(value.value);
      });
    </script>
  </body>
</html>
