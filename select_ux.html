<!doctype html>
<html>
  <head>
    <title>Select UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <form>
        <div class="mb-3">
          <label for="selection" class="form-label">Selection</label>
          <select name="selection" id="selection" class="form-select" required multiple>
            <option value="one">One</option>
            <option value="two">Two</option>
            <option value="three" selected>Three</option>
            <optgroup label="Four">
              <option value="four_a">Four A</option>
              <option value="four_b">Four B</option>
            </optgroup>
            <option value="five">Five</option>
            <option value="volvo">Six</option>
            <option value="seven">Seven</option>
            <optgroup label="Eight">
              <option value="eight_a">Eight A</option>
              <option value="eight_b">Eight B</option>
              <option value="eight_c">Eight C</option>
              <option value="eight_d">Eight D</option>
              <option value="eight_e">Eight E</option>
              <option value="eight_f">Eight F</option>
              <option value="eight_g">Eight G</option>
              <option value="eight_h">Eight H</option>
              <option value="eight_i">Eight I</option>
              <option value="eight_j">Eight J</option>
              <option value="eight_k">Eight K</option>
              <option value="eight_l">Eight L</option>
            </optgroup>
          </select>
        </div>
        <div class="mb-3">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>

    <style>
      .select-ux {
        .select-ux__group {
          .select-ux__group__heading {
            font-weight: bold;
          }

          .select-ux__option {
            margin-left: 1rem;
          }
        }
      }

      .select-ux.select-ux--enhanced {
        max-height: 10rem;
        overflow-y: scroll;
        padding: .375rem .75rem;
        border: var(--bs-border-width) solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
      }

      .select-ux__selections {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
      }
    </style>

    <script>
      class SelectUX
      {
        #select;
        #el;
        #inputClassName;
        #labelClassName;
        #inputParentNodeClassName;
        #groupClassName;
        #groupHeadingClassName;
        #groupHeadingLevel;
        #count = 0;

        constructor({
          select,
          className = 'select-ux',
          inputClassName = 'select-ux__option__input',
          labelClassName = 'select-ux__option__label',
          inputParentNodeClassName = 'select-ux__option',
          groupClassName = 'select-ux__group',
          groupHeadingClassName = 'select-ux__group__heading',
          groupHeadingLevel = 4,
        }) {
          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('You must provide a <select> element.');
          }

          if (!select.id || !select.name) {
            throw new Error('The <select> element must have ID and NAME attributes.');
          }

          this.#select = select;

          this.#inputClassName = inputClassName;
          this.#labelClassName = labelClassName;
          this.#inputParentNodeClassName = inputParentNodeClassName;
          this.#groupClassName = groupClassName;
          this.#groupHeadingClassName = groupHeadingClassName;
          this.#groupHeadingLevel = groupHeadingLevel;

          this.#el = document.createElement('div');
          this.#el.id = select.id;
          this.#el.className = className;

          for (let i = 0; i < select.children.length; i++) {
            const child = select.children.item(i);

            if ('OPTION' === child.tagName) {
              this.#optionToInput(child, this.#el);
            } else if ('OPTGROUP' === child.tagName) {
              this.#optgroupToInputs(child, this.#el);
            }
          }

          select.after(this.#el);

          select.remove();
        }

        #optionToInput(option, container) {
          const parentNode = document.createElement('div');
          parentNode.className = this.#inputParentNodeClassName;

          const input = document.createElement('input');
          input.id = select.id + '_' + this.#count++;
          input.value = option.value;
          input.name = select.name;
          input.checked = option.selected;
          input.className = this.#inputClassName;

          if (select.multiple) {
            input.type = 'checkbox';
            input.name += '[]';
          } else {
            input.type = 'radio';
            input.required = select.required;
          }

          const label = document.createElement('label');
          label.textContent = option.textContent;
          label.className = this.#labelClassName;
          label.setAttribute('for', input.id);

          parentNode.appendChild(input);
          parentNode.appendChild(label);

          container.appendChild(parentNode);
        }

        #optgroupToInputs(optgroup) {
          const group = document.createElement('div');
          group.className = this.#groupClassName;

          const heading = document.createElement('div');
          heading.className = this.#groupHeadingClassName;
          heading.role = 'heading';
          heading.ariaLevel = this.#groupHeadingLevel;
          heading.textContent = optgroup.label;

          group.appendChild(heading);

          for (let i = 0; i < optgroup.children.length; i++) {
            const option = optgroup.children.item(i);

            this.#optionToInput(option, group);
          }

          this.#el.appendChild(group);
        }

        getEl() {
          return this.#el;
        }
      }

      class SelectUXEnhanced
      {
        #container;
        #enhancedClassName;
        #inputSelector;
        #groupSelector;
        #minInputs;
        #searchClassName;
        #searchPlaceholder;
        #selectionsClassName;
        #selectionClassName;
        #emptyMessageClassName;
        #emptyMessage;
        #inputs;
        #groups;
        #empty;
        #search;
        #selections;

        constructor({
          container,
          enhancedClassName = 'select-ux--enhanced',
          inputSelector = '.select-ux__option__input',
          groupSelector = '.select-ux__group',
          minInputs = 5,
          searchClassName = 'select-ux__search',
          searchPlaceholder = 'Search options...',
          selectionsClassName = 'select-ux__selections',
          selectionClassName = 'select-ux__selection',
          emptyMessageClassName = 'select-ux__options__empty',
          emptyMessage = 'No options found.',
        }) {
          this.#container = container;
          this.#enhancedClassName = enhancedClassName;
          this.#inputSelector = inputSelector;
          this.#groupSelector = groupSelector;
          this.#minInputs = minInputs;
          this.#searchClassName = searchClassName;
          this.#searchPlaceholder = searchPlaceholder;
          this.#selectionsClassName = selectionsClassName;
          this.#selectionClassName = selectionClassName;
          this.#emptyMessageClassName = emptyMessageClassName;
          this.#emptyMessage = emptyMessage;

          this.#init();
        }

        #init(reinit = false) {
          this.#inputs = this.#container.querySelectorAll(this.#inputSelector);

          if (!reinit) {
            if (this.#inputs.length <= this.#minInputs) {
              return;
            }

            this.#container.classList.add(this.#enhancedClassName);
          }

          this.#inputs.forEach((input) => {
            input.addEventListener('change', () => {
              this.#change();
            });
          });

          this.#groups = this.#container.querySelectorAll(this.#groupSelector);

          if (!reinit) {
            this.#empty = document.createElement('div');
            this.#empty.className = this.#emptyMessageClassName;
            this.#empty.textContent = this.#emptyMessage;
            this.#empty.style.display = 'none';

            this.#container.prepend(this.#empty);

            this.#search = document.createElement('input');
            this.#search.type = 'search';
            this.#search.className = this.#searchClassName;
            this.#search.placeholder = this.#searchPlaceholder;

            this.#search.addEventListener('input', () => {
              this.#filter();
            });

            this.#search.addEventListener('change', () => {
              this.#filter();
            });

            this.#container.parentNode.insertBefore(this.#search, this.#container);

            this.#selections = document.createElement('div');
            this.#selections.className = this.#selectionsClassName;

            this.#container.parentNode.insertBefore(this.#selections, this.#container);
          }

          this.#filter();
          this.#change();
        }

        reinit() {
          this.#inputs.forEach((input) => {
            input.removeEventListener('change', () => {
              this.#change();
            });
          });

          this.#init(true);
        }

        #filter() {
          const value = this.#search.value.toLowerCase();

          let anyInputVisible = false;

          this.#inputs.forEach(function(input) {
            const match = input.labels[0].textContent.toLowerCase().includes(value);

            input.parentNode.style.display = match ? '' : 'none';

            anyInputVisible |= match;
          });

          this.#groups.forEach((group) => {
            const inputs = group.querySelectorAll(this.#inputSelector);

            let anyGroupInputVisible = false;

            inputs.forEach(function(input) {
              anyGroupInputVisible |= input.parentNode.style.display != 'none';
            });

            group.style.display = anyGroupInputVisible ? '' : 'none';
          });

          this.#empty.style.display = anyInputVisible ? 'none' : '';
        }

        #change() {
          let anyInputChecked = false;

          this.#selections.innerHTML = '<small><strong>Selected:</strong></small>';

          this.#inputs.forEach((input) => {
            if (!input.checked) {
              return;
            }

            anyInputChecked = true;

            const selection = document.createElement('button');
            selection.type = 'button';
            selection.className = this.#selectionClassName;
            selection.textContent = input.labels[0].textContent;

            selection.addEventListener('click', (e) => {
              input.checked = false;

              this.#change();
            });

            this.#selections.appendChild(selection);
          });

          if (!anyInputChecked) {
            this.#selections.innerHTML += '<small><em>None</em></small>';
          }
        }
      }

      const select = document.getElementById('selection');

      const selectUX = new SelectUX({
        select: select,
        inputParentNodeClassName: 'select-ux__option form-check',
        inputClassName: 'select-ux__option__input form-check-input',
        labelClassName: 'select-ux__option__label form-check-label',
      });

      const selectUXEnhanced = new SelectUXEnhanced({
        container: selectUX.getEl(),
        enhancedClassName: 'select-ux--enhanced',
        searchClassName: 'select-ux__search form-control mb-2',
        selectionsClassName: 'select-ux__selections mb-2',
        selectionClassName: 'select-ux__selection btn badge text-bg-secondary',
      })
    </script>
  </body>
</html>
