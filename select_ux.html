<!doctype html>
<html>
  <head>
    <title>Select UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
        <form>
          <div class="mb-3">
            <label for="selection" class="form-label">Selection</label>
            <select name="selection" id="selection" class="form-select" required>
              <option value="one">One</option>
              <option value="two">Two</option>
              <option value="three" selected>Three</option>
              <optgroup label="Four">
                <option value="four_a">Four A</option>
                <option value="four_b">Four B</option>
              </optgroup>
              <option value="five">Five</option>
              <option value="volvo">Six</option>
              <option value="seven">Seven</option>
              <optgroup label="Eight">
                <option value="eight_a">Eight A</option>
                <option value="eight_b">Eight B</option>
                <option value="eight_c">Eight C</option>
                <option value="eight_d">Eight D</option>
                <option value="eight_e">Eight E</option>
                <option value="eight_f">Eight F</option>
                <option value="eight_g">Eight G</option>
                <option value="eight_h">Eight H</option>
                <option value="eight_i">Eight I</option>
                <option value="eight_j">Eight J</option>
                <option value="eight_k">Eight K</option>
                <option value="eight_l">Eight L</option>
              </optgroup>
            </select>
          </div>
          <div class="mb-3">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
      </form>
    </div>

    <style>
      .select-ux {
        .select-ux__selections {
          display: flex;
          flex-wrap: wrap;
          gap: 0.25rem;
          align-items: center;
        }

        .select-ux__inputs {
          max-height: 10rem;
          overflow-y: scroll;
          border: var(--bs-border-width) solid var(--bs-border-color);
          border-radius: var(--bs-border-radius);
          padding: .375rem .75rem;
        }

        .select-ux__group {
          .select-ux__group-heading {
            font-weight: bold;
          }

          .select-ux__input-wrapper {
            margin-left: 1rem;
          }
        }
      }
    </style>

    <script>
      class SelectUX
      {
        static className = 'select-ux';

        #el;
        #search;
        #selections;
        #inputs;

        constructor({
          select,
          groupHeadingLevel = 4,
          searchPlaceholder = 'Search options...',
        }) {
          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('You must provide a <select> element.');
          }

          if (!select.id || !select.name) {
            throw new Error('The <select> element must have ID and NAME attributes.');
          }

          this.#el = document.createElement('div');
          this.#el.id = select.id;
          this.#el.className = SelectUX.className;

          this.#search = new SelectUXSearch({
            placeholder: searchPlaceholder,
          });

          this.#el.appendChild(this.#search.getEl());

          this.#selections = new SelectUXSelections();

          this.#el.appendChild(this.#selections.getEl());

          this.#inputs = new SelectUXInputs({
            select: select,
            groupHeadingLevel: groupHeadingLevel,
          });

          this.#el.appendChild(this.#inputs.getEl());

          select.after(this.#el);

          //select.remove();

          document.addEventListener('select-ux:change', () => {
            this.#onInputChange();
          });

          document.addEventListener('select-ux:search', () => {
            this.#onSearchChange();
          });

          this.#onInputChange();
          this.#onSearchChange();
        }

        #onSearchChange() {
          const value = this.#search.getValue().toLowerCase();

          this.#inputs.filter(value);
        }

        #onInputChange() {
          const checked = this.#inputs.getChecked();

          this.#selections.render(checked);
        }
      }

      class SelectUXSearch
      {
        static className = 'select-ux__search';

        #el;

        static #dispatch() {
          const event = new Event('select-ux:search');

          document.dispatchEvent(event);
        }

        constructor({
          placeholder,
        }) {
          this.#el = document.createElement('input');
          this.#el.type = 'search';
          this.#el.className = SelectUXSearch.className;
          this.#el.placeholder = placeholder;

          this.#el.addEventListener('input', () => {
            SelectUXSearch.#dispatch();
          });

          this.#el.addEventListener('change', () => {
            SelectUXSearch.#dispatch();
          });
        }

        getEl() {
          return this.#el;
        }

        getValue() {
          return this.#el.value;
        }
      }

      class SelectUXSelections
      {
        static className = 'select-ux__selections';
        static selectionClassName = 'select-ux__selection';

        #el;

        constructor() {
          this.#el = document.createElement('div');
          this.#el.className = SelectUXSelections.className;
        }

        getEl() {
          return this.#el;
        }

        render(selectUXInputs) {
          this.#el.innerHTML = '<small><strong>Selected:</strong></small>';

          selectUXInputs.forEach((selectUXInput) => {
            this.#addSelection(selectUXInput);
          });

          if (!selectUXInputs.length) {
            this.#el.innerHTML += '<small><em>None</em></small>';
          }
        }

        #addSelection(selectUXInput) {
          const selection = document.createElement('button');
          selection.type = 'button';
          selection.className = SelectUXSelections.selectionClassName;
          selection.textContent = selectUXInput.getLabel().textContent;

          selection.addEventListener('click', (e) => {
            selectUXInput.setChecked(false);
          });

          this.#el.appendChild(selection);
        }
      }

      class SelectUXInputs
      {
        static className = 'select-ux__inputs';
        static emptyMessageClassName = 'select-ux__inputs__empty';

        #el;
        #emptyMessage;
        #inputs = [];
        #groups = [];

        constructor({
          select,
          groupHeadingLevel,
        }) {
          this.#el = document.createElement('div');
          this.#el.className = SelectUXInputs.className;

          this.#emptyMessage = document.createElement('div');
          this.#emptyMessage.className = SelectUXInputs.emptyMessageClassName;
          this.#emptyMessage.textContent = 'No options found.';
          this.#emptyMessage.style.display = 'none';

          this.#el.appendChild(this.#emptyMessage);

          for (let i = 0; i < select.children.length; i++) {
            const child = select.children.item(i);

            if ('OPTION' === child.tagName) {
              const input = new SelectUXInput({
                option: child,
              });

              this.#el.appendChild(input.getEl());

              this.#inputs.push(input);
            } else if ('OPTGROUP' === child.tagName) {
              const group = new SelectUXGroup({
                optgroup: child,
                headingLevel: groupHeadingLevel,
              });

              this.#el.appendChild(group.getEl());

              this.#groups.push(group);
            }
          }
        }

        getEl() {
          return this.#el;
        }

        filter(value) {
          let anyVisible = false;

          this.#inputs.forEach(function(selectUXInput) {
            anyVisible |= selectUXInput.filter(value);
          });

          this.#groups.forEach(function(selectUXGroup) {
            anyVisible |= selectUXGroup.filter(value);
          });

          this.#emptyMessage.style.display = anyVisible ? 'none' : '';
        }

        getChecked() {
          const checked = [];

          this.#inputs.forEach(function(selectUXInput) {
            if (selectUXInput.getChecked()) {
              checked.push(selectUXInput);
            }
          });

          this.#groups.forEach(function(selectUXGroup) {
            selectUXGroup.getChecked().forEach(function(selectUXInput) {
              checked.push(selectUXInput);
            });
          });

          return checked;
        }
      }

      class SelectUXInput
      {
        static className = 'select-ux__input-wrapper';
        static inputClassName = 'select-ux__input';
        static labelClassName = 'select-ux__input-label';

        #el;
        #input;
        #label;

        static #count = 0;

        static #dispatch() {
          const event = new Event('select-ux:change');

          document.dispatchEvent(event);
        }

        constructor({
          option,
        }) {
          if (!(option instanceof HTMLOptionElement)) {
            throw new Error('You must provide an <option> element.');
          }

          const select = option.closest('select');

          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('Could not find the parent <select> element.');
          }

          this.#el = document.createElement('div');
          this.#el.className = SelectUXInput.className;

          this.#input = document.createElement('input');
          this.#input.id = select.id + '_' + SelectUXInput.#count++;
          this.#input.value = option.value;
          this.#input.name = select.name;
          this.#input.checked = option.selected;
          this.#input.className = SelectUXInput.inputClassName;

          if (select.multiple) {
            this.#input.type = 'checkbox';
            this.#input.name += '[]';
          } else {
            this.#input.type = 'radio';
            this.#input.required = select.required;
          }

          this.#input.addEventListener('change', () => {
            SelectUXInput.#dispatch();
          });

          this.#label = document.createElement('label');
          this.#label.textContent = option.textContent;
          this.#label.className = SelectUXInput.labelClassName;
          this.#label.setAttribute('for', this.#input.id);

          this.#el.appendChild(this.#input);
          this.#el.appendChild(this.#label);
        }

        getEl() {
          return this.#el;
        }

        getLabel() {
          return this.#label;
        }

        getChecked() {
          return this.#input.checked;
        }

        setChecked(checked) {
          this.#input.checked = checked;

          SelectUXInput.#dispatch();
        }

        filter(value) {
          const show = this.#label.textContent.toLowerCase().includes(value);

          this.#el.style.display = show ? '' : 'none';

          return show;
        }
      }

      class SelectUXGroup
      {
        static className = 'select-ux__group';
        static headingClassName = 'select-ux__group-heading';

        #el;
        #heading;
        #inputs = [];

        constructor({
          optgroup,
          headingLevel,
        }) {
          if (!(optgroup instanceof HTMLOptGroupElement)) {
            throw new Error('You must provide an <optgroup> element.');
          }

          const select = optgroup.closest('select');

          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('Could not find the parent <select> element.');
          }

          this.#el = document.createElement('div');
          this.#el.className = SelectUXGroup.className;

          this.#heading = document.createElement('div');
          this.#heading.className = SelectUXGroup.headingClassName;
          this.#heading.role = 'heading';
          this.#heading.ariaLevel = headingLevel;
          this.#heading.textContent = optgroup.label;

          this.#el.appendChild(this.#heading);

          for (let i = 0; i < optgroup.children.length; i++) {
            const option = optgroup.children.item(i);

            const selectUXInput = new SelectUXInput({
              option: option,
            });

            this.#el.appendChild(selectUXInput.getEl());

            this.#inputs.push(selectUXInput);
          }
        }

        getEl() {
          return this.#el;
        }

        getChecked() {
          const checked = [];

          this.#inputs.forEach(function(selectUXInput) {
            if (selectUXInput.getChecked()) {
              checked.push(selectUXInput);
            }
          });

          return checked;
        }

        filter(value) {
          let anyVisible = false;

          this.#inputs.forEach(function(selectUXInput) {
            anyVisible |= selectUXInput.filter(value);
          });

          this.#el.style.display = anyVisible ? '' : 'none';

          return anyVisible;
        }
      }

      const select = document.getElementById('selection');

      SelectUXSearch.className += ' form-control mb-2';

      SelectUXSelections.className += ' mb-2';
      SelectUXSelections.selectionClassName += ' btn badge text-bg-secondary';

      SelectUXInput.className += ' form-check';
      SelectUXInput.inputClassName += ' form-check-input';
      SelectUXInput.labelClassName += ' form-check-label';

      const selectUX = new SelectUX({
        select: select,
      });
    </script>
  </body>
</html>
