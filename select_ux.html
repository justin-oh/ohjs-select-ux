<!doctype html>
<html>
  <head>
    <title>Select UX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
        <form>
          <div class="mb-3">
            <label for="selection" class="form-label">Selection</label>
            <select name="selection" id="selection" class="form-select" required>
              <option value="one">One</option>
              <option value="two">Two</option>
              <option value="three" selected>Three</option>
              <optgroup label="Four">
                <option value="four_a">Four A</option>
                <option value="four_b">Four B</option>
              </optgroup>
              <option value="five">Five</option>
              <option value="volvo">Six</option>
              <option value="seven">Seven</option>
              <optgroup label="Eight">
                <option value="eight_a">Eight A</option>
                <option value="eight_b">Eight B</option>
                <option value="eight_c">Eight C</option>
                <option value="eight_d">Eight D</option>
                <option value="eight_e">Eight E</option>
                <option value="eight_f">Eight F</option>
                <option value="eight_g">Eight G</option>
                <option value="eight_h">Eight H</option>
                <option value="eight_i">Eight I</option>
                <option value="eight_j">Eight J</option>
                <option value="eight_k">Eight K</option>
                <option value="eight_l">Eight L</option>
              </optgroup>
            </select>
          </div>
          <div class="mb-3">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
      </form>
    </div>

    <style>
      .select-ux {
        .select-ux__selections {
          display: flex;
          flex-wrap: wrap;
          gap: 0.25rem;
          align-items: center;
        }

        .select-ux__options {
          max-height: 10rem;
          overflow-y: scroll;
        }

        .select-ux__group {
          .select-ux__group-heading {
            font-weight: bold;
          }

          .select-ux__option {
            margin-left: 1rem;
          }
        }
      }
    </style>

    <script>
      class SelectUX
      {
        #el;
        #search;
        #selections;
        #options;

        constructor({
          select,
          groupHeadingLevel = 4,
          className = 'select-ux',
          searchClassName = 'select-ux__search',
          searchPlaceholder = 'Search options...',
          selectionsClassName = 'select-ux__selections',
          selectionClassName = 'select-ux__selection',
          optionsClassName = 'select-ux__options',
          optionsEmptyMessageClassName = 'select-ux__options__empty',
          optionsEmptyMessage = 'No options found.',
          optionClassName = 'select-ux__option',
          optionInputClassName = 'select-ux__option__input',
          optionLabelClassName = 'select-ux__option__label',
          groupClassName = 'select-ux__group',
          groupHeadingClassName = 'select-ux__group__heading',
        }) {
          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('You must provide a <select> element.');
          }

          if (!select.id || !select.name) {
            throw new Error('The <select> element must have ID and NAME attributes.');
          }

          this.#el = document.createElement('div');
          this.#el.id = select.id;
          this.#el.className = className;

          this.#search = new SelectUXSearch({
            className: searchClassName,
            placeholder: searchPlaceholder,
          });

          this.#el.appendChild(this.#search.getEl());

          this.#selections = new SelectUXSelections({
            className: selectionsClassName,
            selectionClassName: selectionClassName,
          });

          this.#el.appendChild(this.#selections.getEl());

          this.#options = new SelectUXOptions({
            select,
            groupHeadingLevel,
            className: optionsClassName,
            emptyMessageClassName: optionsEmptyMessageClassName,
            emptyMessage: optionsEmptyMessage,
            optionClassName,
            optionInputClassName,
            optionLabelClassName,
            groupClassName,
            groupHeadingClassName,
          });

          this.#el.appendChild(this.#options.getEl());

          select.after(this.#el);

          //select.remove();

          document.addEventListener('select-ux:change', () => {
            this.#onInputChange();
          });

          document.addEventListener('select-ux:search', () => {
            this.#onSearchChange();
          });

          this.#onInputChange();
          this.#onSearchChange();
        }

        #onSearchChange() {
          const value = this.#search.getValue().toLowerCase();

          this.#options.filter(value);
        }

        #onInputChange() {
          const checked = this.#options.getChecked();

          this.#selections.render(checked);
        }
      }

      class SelectUXSearch
      {
        #el;

        static #dispatchEvent() {
          const event = new Event('select-ux:search');

          document.dispatchEvent(event);
        }

        constructor({
          className,
          placeholder,
        }) {
          this.#el = document.createElement('input');
          this.#el.type = 'search';
          this.#el.className = className;
          this.#el.placeholder = placeholder;

          this.#el.addEventListener('input', () => {
            SelectUXSearch.#dispatchEvent();
          });

          this.#el.addEventListener('change', () => {
            SelectUXSearch.#dispatchEvent();
          });
        }

        getEl() {
          return this.#el;
        }

        getValue() {
          return this.#el.value;
        }
      }

      class SelectUXSelections
      {
        #el;
        #selectionClassName;

        constructor({
          className,
          selectionClassName,
        }) {
          this.#el = document.createElement('div');
          this.#el.className = className;

          this.#selectionClassName = selectionClassName;
        }

        getEl() {
          return this.#el;
        }

        render(selectUXOptions) {
          this.#el.innerHTML = '<small><strong>Selected:</strong></small>';

          selectUXOptions.forEach((selectUXOption) => {
            this.#addSelection(selectUXOption);
          });

          if (!selectUXOptions.length) {
            this.#el.innerHTML += '<small><em>None</em></small>';
          }
        }

        #addSelection(selectUXOption) {
          const selection = document.createElement('button');
          selection.type = 'button';
          selection.className = this.#selectionClassName;
          selection.textContent = selectUXOption.getLabel().textContent;

          selection.addEventListener('click', (e) => {
            selectUXOption.setChecked(false);
          });

          this.#el.appendChild(selection);
        }
      }

      class SelectUXOptions
      {
        #el;
        #emptyMessage;
        #options = [];
        #groups = [];

        constructor({
          select,
          groupHeadingLevel,
          className,
          emptyMessageClassName,
          emptyMessage,
          optionClassName,
          optionInputClassName,
          optionLabelClassName,
          groupClassName,
          groupHeadingClassName,
        }) {
          this.#el = document.createElement('div');
          this.#el.className = className;

          this.#emptyMessage = document.createElement('div');
          this.#emptyMessage.className = emptyMessageClassName;
          this.#emptyMessage.textContent = emptyMessage;
          this.#emptyMessage.style.display = 'none';

          this.#el.appendChild(this.#emptyMessage);

          for (let i = 0; i < select.children.length; i++) {
            const child = select.children.item(i);

            if ('OPTION' === child.tagName) {
              const input = new SelectUXOption({
                option: child,
                className: optionClassName,
                inputClassName: optionInputClassName,
                labelClassName: optionLabelClassName,
              });

              this.#el.appendChild(input.getEl());

              this.#options.push(input);
            } else if ('OPTGROUP' === child.tagName) {
              const group = new SelectUXGroup({
                optgroup: child,
                headingLevel: groupHeadingLevel,
                className: groupClassName,
                headingClassName: groupHeadingClassName,
                optionClassName,
                optionInputClassName,
                optionLabelClassName,
              });

              this.#el.appendChild(group.getEl());

              this.#groups.push(group);
            }
          }
        }

        getEl() {
          return this.#el;
        }

        filter(value) {
          let anyVisible = false;

          this.#options.forEach(function(selectUXOption) {
            anyVisible |= selectUXOption.filter(value);
          });

          this.#groups.forEach(function(selectUXGroup) {
            anyVisible |= selectUXGroup.filter(value);
          });

          this.#emptyMessage.style.display = anyVisible ? 'none' : '';
        }

        getChecked() {
          const checked = [];

          this.#options.forEach(function(selectUXOption) {
            if (selectUXOption.getChecked()) {
              checked.push(selectUXOption);
            }
          });

          this.#groups.forEach(function(selectUXGroup) {
            selectUXGroup.getChecked().forEach(function(selectUXOption) {
              checked.push(selectUXOption);
            });
          });

          return checked;
        }
      }

      class SelectUXOption
      {
        #el;
        #input;
        #label;

        static #count = 0;

        static #dispatchEvent() {
          const event = new Event('select-ux:change');

          document.dispatchEvent(event);
        }

        constructor({
          option,
          className,
          inputClassName,
          labelClassName,
        }) {
          if (!(option instanceof HTMLOptionElement)) {
            throw new Error('You must provide an <option> element.');
          }

          const select = option.closest('select');

          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('Could not find the parent <select> element.');
          }

          this.#el = document.createElement('div');
          this.#el.className = className;

          this.#input = document.createElement('input');
          this.#input.id = select.id + '_' + SelectUXOption.#count++;
          this.#input.value = option.value;
          this.#input.name = select.name;
          this.#input.checked = option.selected;
          this.#input.className = inputClassName;

          if (select.multiple) {
            this.#input.type = 'checkbox';
            this.#input.name += '[]';
          } else {
            this.#input.type = 'radio';
            this.#input.required = select.required;
          }

          this.#input.addEventListener('change', () => {
            SelectUXOption.#dispatchEvent();
          });

          this.#label = document.createElement('label');
          this.#label.textContent = option.textContent;
          this.#label.className = labelClassName;
          this.#label.setAttribute('for', this.#input.id);

          this.#el.appendChild(this.#input);
          this.#el.appendChild(this.#label);
        }

        getEl() {
          return this.#el;
        }

        getLabel() {
          return this.#label;
        }

        getChecked() {
          return this.#input.checked;
        }

        setChecked(checked) {
          this.#input.checked = checked;

          SelectUXOption.#dispatchEvent();
        }

        filter(value) {
          const show = this.#label.textContent.toLowerCase().includes(value);

          this.#el.style.display = show ? '' : 'none';

          return show;
        }
      }

      class SelectUXGroup
      {
        #el;
        #heading;
        #options = [];

        constructor({
          optgroup,
          headingLevel,
          className,
          headingClassName,
          optionClassName,
          optionInputClassName,
          optionLabelClassName,
        }) {
          if (!(optgroup instanceof HTMLOptGroupElement)) {
            throw new Error('You must provide an <optgroup> element.');
          }

          const select = optgroup.closest('select');

          if (!(select instanceof HTMLSelectElement)) {
            throw new Error('Could not find the parent <select> element.');
          }

          this.#el = document.createElement('div');
          this.#el.className = className;

          this.#heading = document.createElement('div');
          this.#heading.className = headingClassName;
          this.#heading.role = 'heading';
          this.#heading.ariaLevel = headingLevel;
          this.#heading.textContent = optgroup.label;

          this.#el.appendChild(this.#heading);

          for (let i = 0; i < optgroup.children.length; i++) {
            const option = optgroup.children.item(i);

            const selectUXOption = new SelectUXOption({
              option: option,
              className: optionClassName,
              inputClassName: optionInputClassName,
              labelClassname: optionLabelClassName,
            });

            this.#el.appendChild(selectUXOption.getEl());

            this.#options.push(selectUXOption);
          }
        }

        getEl() {
          return this.#el;
        }

        getChecked() {
          const checked = [];

          this.#options.forEach(function(selectUXOption) {
            if (selectUXOption.getChecked()) {
              checked.push(selectUXOption);
            }
          });

          return checked;
        }

        filter(value) {
          let anyVisible = false;

          this.#options.forEach(function(selectUXOption) {
            anyVisible |= selectUXOption.filter(value);
          });

          this.#el.style.display = anyVisible ? '' : 'none';

          return anyVisible;
        }
      }

      const select = document.getElementById('selection');

      const selectUX = new SelectUX({
        select: select,
        searchClassName: 'select-ux__search form-control mb-2',
        selectionsClassName: 'select-ux__selections mb-2',
        selectionClassName: 'select-ux__selecion btn badge text-bg-secondary',
        optionsClassName: 'select-ux__options form-control',
        optionClassName: 'select-ux__option form-check',
        optionInputClassName: 'select-ux__option__input form-check-input',
        optionLabelClassName: 'select-ux__option__label form-check-label',
      });
    </script>
  </body>
</html>
